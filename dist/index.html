<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wanderers Path</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #000;
        color: #00ff00;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        gap: 16px;
      }
      #app { font-size: 13px; color: #006600; }
      #nameForm {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        border: 1px solid #00ff00;
        padding: 20px;
        width: 100%;
        max-width: 340px;
      }
      #nameForm h2 { font-size: 16px; letter-spacing: 2px; }
      #nameForm p  { font-size: 12px; color: #009900; text-align: center; }
      #nameInput {
        background: #000;
        border: 1px solid #00ff00;
        color: #00ff00;
        font-family: monospace;
        font-size: 18px;
        padding: 8px 12px;
        width: 100%;
        text-align: center;
        letter-spacing: 3px;
        outline: none;
      }
      #nameInput::placeholder { color: #004400; }
      #nameSubmit {
        background: #003300;
        border: 1px solid #00ff00;
        color: #00ff00;
        font-family: monospace;
        font-size: 14px;
        padding: 8px 24px;
        cursor: pointer;
        letter-spacing: 2px;
        width: 100%;
      }
      #nameSubmit:hover { background: #005500; }
      #nameSubmit:disabled { opacity: 0.4; cursor: not-allowed; }
      #statsPanel {
        display: none;
        flex-direction: column;
        border: 1px solid #00aa00;
        padding: 12px;
        width: 100%;
        max-width: 340px;
        font-size: 13px;
        gap: 0;
      }
      .stats-title {
        font-size: 14px;
        letter-spacing: 2px;
        margin-bottom: 8px;
        color: #00ff00;
        border-bottom: 1px solid #004400;
        padding-bottom: 6px;
      }
      .stats-row {
        display: flex;
        justify-content: space-between;
        padding: 3px 0;
      }
      .stats-row .label { color: #006600; }
      .stats-row .value { color: #00ff00; }
      .stats-divider { border-top: 1px solid #003300; margin: 6px 0; }
      .stats-inv      { color: #00cc00; margin-top: 4px; font-size: 12px; }
      .stats-passive  { color: #009900; font-size: 11px; margin-top: 4px; font-style: italic; }
    </style>
    <script type="module" crossorigin src="/assets/index-BNixzX_l.js"></script>
  </head>
  <body>
    <div id="app">Connecting...</div>

    <div id="nameForm">
      <h2>WANDERERS PATH</h2>
      <p>Choose your shape on the glasses.<br/>Enter your name below:</p>
      <input id="nameInput" type="text" maxlength="12" placeholder="Enter name..."
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <button id="nameSubmit" disabled>CONFIRM NAME</button>
    </div>

    <div id="statsPanel">
      <div class="stats-title">⚔ WANDERER STATUS</div>
      <div class="stats-row"><span class="label">Name</span><span class="value" id="st-hero">-</span></div>
      <div class="stats-row"><span class="label">Shape</span><span class="value" id="st-class">-</span></div>
      <div class="stats-divider"></div>
      <div class="stats-row"><span class="label">HP</span><span class="value" id="st-hp">-</span></div>
      <div class="stats-row"><span class="label">Max HP</span><span class="value" id="st-maxhp">-</span></div>
      <div class="stats-row"><span class="label">Attack</span><span class="value" id="st-atk">-</span></div>
      <div class="stats-row"><span class="label">Gold</span><span class="value" id="st-gold">-</span></div>
      <div class="stats-row"><span class="label">Fights Won</span><span class="value" id="st-fights">0</span></div>
      <div class="stats-divider"></div>
      <div class="stats-row"><span class="label">Quest</span><span class="value" id="st-quest">-</span></div>
      <div class="stats-row"><span class="label">Titles</span><span class="value" id="st-titles">-</span></div>
      <div class="stats-divider"></div>
      <div class="stats-inv"    id="st-inv">INV: empty</div>
      <div class="stats-passive" id="st-passive"></div>
    </div>

 
</script>

  </body>
</html>
